<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <style>
    @media (prefers-reduced-motion: reduce){ #a, #b { x: 10px !important; } }
  </style>
  <rect width="300" height="100" fill="#000"/>
  <!-- SMIL -->
  <rect id="a" x="10" y="10" width="40" height="30" fill="#22C55E">
    <animate attributeName="x" values="10;250;10" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- CSS animation, for comparison -->
  <rect id="b" x="10" y="55" width="40" height="30" fill="#F59E0B" style="animation:m 2s linear infinite"/>
  <style>@keyframes m{0%{transform:translateX(0)}50%{transform:translateX(210px)}100%{transform:translateX(0)}}</style>
</svg>
